# Beschreibung des Xcode-Projekts. Daraus erzeugt XcodeGen `Gebetszeiten.xcodeproj`:
#
#   make project        (oder: xcodegen generate)
#
# Das erzeugte Projekt liegt nicht in Git. Änderungen an Targets, Einstellungen und
# Info.plist gehören hierher, nicht ins Projekt.

name: Gebetszeiten

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Platzhalter – vor dem ersten Archiv ersetzen (docs/BUILD-PLAN.md, Spec § 6.9).
    # Die App Group steht nur hier; die Entitlements beider Targets lesen sie von hier.
    APP_BUNDLE_ID: com.example.gebetszeiten
    APP_GROUP_ID: group.com.example.gebetszeiten
    # TODO(placeholder): Adresse hinter Einstellungen › Quellcode („Open Source auf GitHub“). Das Repo hat
    # noch keine öffentliche Adresse; vor dem ersten Archiv eintragen.
    SOURCE_CODE_URL: https://example.com/gebetszeiten
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  PrayerCore:
    path: Packages/PrayerCore
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features

targets:
  Gebetszeiten:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # Nur iPhone (das iPhone Duo gehört dazu). Am Target, nicht beim Projekt: XcodeGen setzt für
        # iOS-Targets sonst „1,2“, und als iPad-App ohne alle vier Ausrichtungen lehnt Apple den Upload ab.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # TODO(placeholder): Platzhalter-Icon aus Phase 11 (Tagesbogen mit den fünf Gebeten), erzeugt von
        # scripts/app-icon.swift; das endgültige Icon folgt (Spec § 6.9).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gebetszeiten
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Die Texte liegen im Paket DesignSystem. Ohne diese Liste würde iOS die App
        # nur in der Entwicklungssprache starten.
        CFBundleLocalizations: [de, tr, en, es]
        UILaunchScreen: {}
        # Hochformat; die Ausrichtung auf dem iPhone Duo klärt Phase 10 (docs/OPEN-QUESTIONS.md).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        # Begründung im System-Dialog der Standortabfrage. Grundwert für die Info.plist; die vier
        # Sprachen stehen in App/InfoPlist.xcstrings. Beides kommt aus `T.alLocBody` im Prototyp –
        # `scripts/import-strings --check` prüft, dass dieser Wert dem deutschen Text entspricht.
        NSLocationWhenInUseUsageDescription: "Dein Standort wird nur auf diesem Gerät zur Berechnung der Gebetszeiten verwendet."
        # Die App Group, in deren UserDefaults die Einstellungen liegen (Features: SettingsStore),
        # damit Widgets und Live-Aktivität sie ab Phase 9 lesen können.
        AppGroupIdentifier: $(APP_GROUP_ID)
        # Adresse hinter Einstellungen › Quellcode (Features: AppInfo.sourceCodeURL).
        SourceCodeURL: $(SOURCE_CODE_URL)
        # Hintergrundaktualisierung (Phase 8): iOS weckt die App etwa einmal am Tag kurz, und sie plant
        # die Mitteilungen neu (Features: BackgroundRefresh). Die Kennung ist die Bundle-ID mit „.refresh“.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(APP_BUNDLE_ID).refresh]
        # Exportkontrolle: Die App verschlüsselt nicht selbst; ins Netz geht sie nur über MapKit, mit dem
        # HTTPS des Systems. Damit entfällt die Frage bei jedem Upload (docs/APP-STORE.md).
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Gebetszeiten.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: Features
      - package: DesignSystem
      - package: PrayerCore
      - target: GebetszeitenWidgets

  GebetszeitenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        # Wie die App: nur iPhone.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Gebetszeiten
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [de, tr, en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Die App Group, aus der Widgets und Live-Aktivität den Stand der App lesen (DesignSystem: WidgetState).
        AppGroupIdentifier: $(APP_GROUP_ID)
    entitlements:
      path: Widgets/GebetszeitenWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: DesignSystem
      - package: PrayerCore

schemes:
  Gebetszeiten:
    build:
      targets:
        Gebetszeiten: all
    run:
      config: Debug
      # Die Debug-Startargumente aus CLAUDE.md, zum An- und Abhaken im Schema.
      commandLineArguments:
        "-debugSkipOnboarding": false
        "-debugFixtureTimes": false
        "-debugDate 2026-11-10": false
        "-debugTime 14:25": false
        "-debugCity berlin": false
        "-debugHighLatitude": false
        "-debugLocationDenied": false
        "-debugOffline": false
        "-debugTab today": false
        "-debugQiblaHeading 137": false
        "-debugNotifications": false
        "-debugLiveActivity": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: PrayerCore/PrayerCoreTests
        - package: DesignSystem/DesignSystemTests
        - package: Features/FeaturesTests
    archive:
      config: Release
