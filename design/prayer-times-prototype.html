<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prayer Times · iOS Design Prototype</title>
<style>
/* =====================================================================
   PRAYER TIMES · iOS DESIGN PROTOTYPE (single file, no dependencies)
   Sections:  1 Design tokens · 2 Base & device frame · 3 App chrome
              4 Components · 5 Screens · 6 Widgets & notifications
              7 Prototype panel
   Everything the native app needs is in section 1 (tokens) and in the
   JS objects T (strings), CITIES/METHODS (data) and S (state).
   ===================================================================== */

/* ---------- 1) DESIGN TOKENS ---------------------------------------- */
:root{
  /* Spacing (pt) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  --inset:16px;          /* horizontal margin of inset-grouped lists */
  --tap:44px;            /* HIG minimum touch target                 */
  --row-min:44px;        /* minimum list-row height                  */
  --row-h:52px;          /* prayer row height (density: regular)     */
  --chip-gap:8px;        /* gap between settings circle, capsule and chips */
  --bar-inset:4px;       /* chips inset inside the glass capsule     */

  /* Corner radii */
  --r-row:18px /* standalone prayer cards */; --r-xs:6px; --r-sm:10px; --r-group:26px /* cards & list groups, continuous – as Projekt-Health */; --r-card:20px; --r-widget:22px;
  --r-sheet:24px; --r-button:25px; --r-screen:56px; --r-pill:999px;

  /* Type families (SF Pro on Apple platforms) */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro","Helvetica Neue",system-ui,sans-serif;
  --font-rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;

  /* Dynamic Type multiplier (1 = Large/default, 1.35 ≈ xxxLarge) */
  --ts:1;

  /* Motion */
  --ease-spring:cubic-bezier(.32,.72,0,1);    /* push, sheet: iOS-like damped spring */
  --ease-bounce:cubic-bezier(.34,1.45,.64,1); /* switches, small pops                */
  --dur-fast:.2s; --dur:.38s; --dur-sheet:.5s;
}
/* Type scale – recomputed on every phone screen so --ts can change per device */
:root,.screen{
  --fs-large-title:calc(34px*var(--ts));
  --fs-title1:calc(28px*var(--ts));
  --fs-title2:calc(22px*var(--ts));
  --fs-title3:calc(20px*var(--ts));
  --fs-headline:calc(17px*var(--ts));
  --fs-body:calc(17px*var(--ts));
  --fs-callout:calc(16px*var(--ts));
  --fs-subhead:calc(15px*var(--ts));
  --fs-footnote:calc(13px*var(--ts));
  --fs-caption1:calc(12px*var(--ts));
  --fs-caption2:calc(11px*var(--ts));
  --fs-countdown:calc(64px*min(var(--ts),1.05)); /* display numerals, capped */
  --bar-h:calc(56px*min(var(--ts),1.15));         /* top bar: chips with name + value (grows like a tab bar, capped) */
}
/* Accent palettes (light / dark). Default proposal: Pine Teal */
[data-accent="teal"]  {--accent-l:#1F7A6D; --accent-d:#4CC2AE;}
[data-accent="green"] {--accent-l:#2E7D4F; --accent-d:#5FCB8A;}
[data-accent="indigo"]{--accent-l:#4252B5; --accent-d:#8E9BFF;}
[data-accent="sand"]  {--accent-l:#8F6420; --accent-d:#E2B566;}

/* Semantic colors – iOS system values */
[data-theme="light"]{
  color-scheme:light;
  --accent:var(--accent-l); --on-accent:#FFFFFF;
  --label:#000000; --label-2:#6C6C70 /* 4.7:1 page, 5.2:1 card – Projekt-Health textSecondary */; --label-3:rgba(60,60,67,.3); --label-4:rgba(60,60,67,.18);
  --bg:#FFFFFF; --bg-grouped:#F2F2F7; --bg-cell:#FFFFFF;
  --bg-grouped-el:#F2F2F7; --bg-cell-el:#FFFFFF;           /* inside sheets */
  --separator:rgba(60,60,67,.29);
  --fill-1:rgba(120,120,128,.2); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(118,118,128,.12); --fill-4:rgba(116,116,128,.08);
  --seg-thumb:#FFFFFF;
  --glass:rgba(255,255,255,.62); --glass-stroke:rgba(255,255,255,.9); --glass-edge:rgba(0,0,0,.07);
  --lg-tint:rgba(255,255,255,.5); --lg-hi:rgba(255,255,255,.95); --lg-rim:rgba(255,255,255,.55); --lg-edge:rgba(0,0,0,.08);
  --lg-shadow:0 8px 24px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06); --tab-sel:rgba(118,118,128,.14);
  --bar:rgba(242,242,247,.92);
  --alert-bg:rgba(242,242,242,.88);
  --shadow-float:0 8px 28px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06);
  --red:#FF3B30; --orange:#FF9500; --green:#34C759; --blue:#007AFF;
  --page:#E6E6EB; --panel:#F7F7F9;
}
[data-theme="dark"]{
  color-scheme:dark;
  --accent:var(--accent-d); --on-accent:#04221D;
  --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --label-4:rgba(235,235,245,.16);
  --bg:#000000; --bg-grouped:#000000; --bg-cell:#1C1C1E;
  --bg-grouped-el:#1C1C1E; --bg-cell-el:#2C2C2E;
  --separator:rgba(84,84,88,.65);
  --fill-1:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.24); --fill-4:rgba(118,118,128,.18);
  --seg-thumb:#636366;
  --glass:rgba(58,58,62,.55); --glass-stroke:rgba(255,255,255,.14); --glass-edge:rgba(0,0,0,.4);
  --lg-tint:rgba(48,48,52,.46); --lg-hi:rgba(255,255,255,.26); --lg-rim:rgba(255,255,255,.08); --lg-edge:rgba(0,0,0,.55);
  --lg-shadow:0 8px 24px rgba(0,0,0,.45); --tab-sel:rgba(255,255,255,.13);
  --bar:rgba(0,0,0,.86);
  --alert-bg:rgba(37,37,37,.88);
  --shadow-float:0 8px 28px rgba(0,0,0,.5);
  --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --blue:#0A84FF;
  --page:#0E0E10; --panel:#161618;
}
[data-theme]{ --accent-tint:color-mix(in srgb,var(--accent) 13%,transparent); --arc-track:color-mix(in srgb,var(--accent) 20%,var(--bg-grouped)); }
[data-theme="dark"]{ --arc-track:color-mix(in srgb,var(--accent) 30%,var(--bg-grouped)); --kerahat:#D9A04E; --kerahat-text:#E3B36B; }
[data-theme="light"]{ --kerahat:#C7862A; --kerahat-text:#9A6212; }

/* ---------- 2) BASE & DEVICE FRAME ---------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;min-height:100vh;background:var(--page);color:var(--label);font-family:var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
[dir="rtl"] .flip-rtl{transform:scaleX(-1)}
.muted{color:var(--label-2)} .accent{color:var(--accent)}
.tabnum{font-variant-numeric:tabular-nums}

#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap;padding:24px;min-height:100vh;--s:1}
.frame-col{display:flex;flex-direction:column;align-items:center;gap:12px}
.frame-label{font:600 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--label-2)}
.frame{position:relative;flex:none;width:calc(var(--dw,414px)*var(--s));height:calc(var(--dh,868px)*var(--s))}
.device{position:absolute;left:0;top:0;width:var(--dw,414px);height:var(--dh,868px);padding:12px;border-radius:var(--dr,68px);
  transform:scale(var(--s));transform-origin:0 0;
  background:linear-gradient(155deg,#3b3b3e 0%,#1d1d1f 38%,#0e0e0f 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 5px #050505,
             0 50px 100px -24px rgba(0,0,0,.38),0 24px 48px -28px rgba(0,0,0,.45)}
.hw{position:absolute;width:3px;background:#2b2b2d;border-radius:2px}
.hw.action{left:-3px;top:150px;height:32px}
.hw.vup{left:-3px;top:206px;height:58px}
.hw.vdown{left:-3px;top:276px;height:58px}
.hw.power{right:-3px;top:236px;height:96px}
.frame[data-dev^="duo"] .hw.action,.frame[data-dev^="duo"] .hw.vup,.frame[data-dev^="duo"] .hw.vdown{display:none}
.frame[data-dev^="duo"] .hw.power{top:110px;height:64px}   /* side button with Touch ID */

/* ---------- 3) APP CHROME: screen, status bar, island, tab bar ------ */
.screen{position:relative;width:390px;height:844px;border-radius:var(--r-screen);overflow:hidden;isolation:isolate;
  background:var(--bg-grouped);color:var(--label);font-family:var(--font);font-size:var(--fs-body);
  line-height:1.3;letter-spacing:-.41px;text-align:start;--dx:1}
.screen[dir="rtl"]{--dx:-1}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:90;pointer-events:none}
.home-ind{position:absolute;bottom:8px;left:50%;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:var(--label);z-index:90;pointer-events:none}
.status-bar{position:absolute;top:0;left:0;right:0;height:54px;z-index:80;display:flex;align-items:center;
  pointer-events:none;color:var(--label);font:600 17px/1 var(--font);letter-spacing:-.3px;transition:color .3s}
.sb-time{width:132px;text-align:center;padding-top:5px;font-variant-numeric:tabular-nums}
.sb-gap{flex:1}
.sb-icons{width:132px;display:flex;justify-content:center;align-items:center;gap:6px;padding-top:5px}
.screen.sheet-open .status-bar{color:#fff}

.app-layer{position:absolute;inset:0;overflow:hidden;background:var(--bg-grouped);transform-origin:50% 0;
  transition:transform var(--dur-sheet) var(--ease-spring),border-radius var(--dur-sheet) var(--ease-spring),filter var(--dur-sheet)}
.screen.sheet-open{background:#000}
.screen.sheet-open .app-layer{transform:translateY(46px) scale(.92);border-radius:14px;filter:brightness(.88)}
.screen.sheet-open.opening .app-layer,.screen.sheet-open.closing .app-layer{transform:none;border-radius:0;filter:none}

.screen[data-chips="label"]{--bar-h:calc(52px*min(var(--ts),1.15))}
.app-screen{-webkit-user-select:none;user-select:none}
.app-screen input{-webkit-user-select:text;user-select:text}

/* Liquid Glass – approximation of SwiftUI .glassEffect(.regular) / .buttonStyle(.glass) */
.lg{position:relative;background:var(--lg-tint);
  -webkit-backdrop-filter:blur(12px) saturate(190%) brightness(1.04);backdrop-filter:blur(12px) saturate(190%) brightness(1.04);
  box-shadow:inset 0 1px 0 0 var(--lg-hi),inset 0 0 0 .5px var(--lg-rim),0 0 0 .5px var(--lg-edge),var(--lg-shadow)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 72%,rgba(255,255,255,.14) 100%)}

/* Top bar (as Projekt-Health "Heute"): settings circle left, glass capsule with page chips right.
   Fixed over both pages, no own background – content scrolls under it. No glass on glass: chips have no glass. */
.topbar{position:absolute;z-index:15;top:58px;left:var(--inset);right:var(--inset);display:flex;align-items:center;gap:var(--chip-gap);pointer-events:none}
.topbar>*{pointer-events:auto}
.gear-btn{flex:none;width:var(--bar-h);height:var(--bar-h);padding:0;border:0;border-radius:50%;display:grid;place-items:center;color:var(--label)}
.gear-btn:active{transform:scale(.94)}
.chips{flex:0 1 auto;min-width:0;display:flex;gap:var(--chip-gap)}   /* each chip is its own glass bubble */
.chip{flex:none;display:flex;align-items:center;gap:7px;height:var(--bar-h);padding:0 18px 0 14px;border:0;border-radius:var(--r-pill);
  color:var(--label);text-align:start;transition:background .3s,box-shadow .3s,color .3s}
/* Selected = tinted Liquid Glass (SwiftUI: .glassEffect(.regular.tint(accent).interactive())), no outline */
.chip[aria-selected="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 17%,var(--lg-tint));
  box-shadow:inset 0 1px 0 0 var(--lg-hi),inset 0 0 0 .5px var(--lg-rim),0 0 0 .5px var(--lg-edge),
             0 10px 26px color-mix(in srgb,var(--accent) 24%,transparent),0 1px 3px rgba(0,0,0,.06)}
.chip .ic{color:var(--label-2)}
.chip[aria-selected="true"] .ic{color:var(--accent)}
.chip[aria-selected="true"] .chip-name{color:inherit;opacity:.8}
.chip-txt{display:flex;flex-direction:column;justify-content:center}
.chip-name{font:400 calc(12px*min(var(--ts),1.15))/1.25 var(--font);letter-spacing:0;color:var(--label-2)}
.chip-val{font:600 calc(17px*min(var(--ts),1.15))/1.25 var(--font);letter-spacing:-.41px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:focus-visible{outline-offset:-1px}
/* When the labels do not fit (German, large text): unselected chips collapse to glass circles (SwiftUI: ViewThatFits) */
.topbar.collapse .chip:not([aria-selected="true"]){width:var(--bar-h);padding:0;justify-content:center}
.topbar.collapse .chip:not([aria-selected="true"]) .chip-txt{display:none}
/* Scroll-edge effect the system draws under a top bar once content scrolls beneath it */
.tabbar{position:absolute;z-index:16;bottom:22px;left:22px;right:22px;height:62px;border-radius:31px;display:flex;padding:4px}
.tab{flex:1;border:0;background:transparent;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--label);font:600 10px/12px var(--font);letter-spacing:.1px;transition:background .25s,color .25s}
.tab[aria-selected="true"]{color:var(--accent);background:var(--tab-sel)}
.tab:focus-visible{outline-offset:-2px}
.edge{position:absolute;z-index:14;top:0;left:0;right:0;height:calc(58px + var(--bar-h) + 22px);pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(var(--bg-grouped) 0%,color-mix(in srgb,var(--bg-grouped) 72%,transparent) 55%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.root-page.scrolled .edge{opacity:1}
/* Two pages side by side, swipe or tap a chip to switch */
.pager{position:absolute;inset:0;display:flex;touch-action:pan-y;transition:transform .5s var(--ease-spring)}
.pager.dragging{transition:none}
.pane{position:relative;flex:0 0 100%;height:100%;overflow:hidden}
.pane-page{position:absolute;inset:0;background:var(--bg-grouped)}
.root-page .scroll{padding-top:calc(58px + var(--bar-h) + 8px)}
.eyebrow{margin:6px 0 10px;text-align:center;font:400 var(--fs-subhead)/1.3 var(--font);letter-spacing:.3px;text-transform:uppercase;color:var(--label-2)}

/* Pages & navigation stack */
.main{position:absolute;inset:0}
.main.fade-in{animation:fadeIn .45s var(--ease-spring)}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.page{position:absolute;inset:0;background:var(--bg-grouped);transition:transform var(--dur) var(--ease-spring),visibility 0s}
.page.enter{transform:translateX(calc(100% * var(--dx)));box-shadow:0 0 30px rgba(0,0,0,.18)}
.page.under{transform:translateX(calc(-30% * var(--dx)));visibility:hidden;transition:transform var(--dur) var(--ease-spring),visibility 0s var(--dur)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding-top:98px}
.scroll::-webkit-scrollbar{display:none}
.tab-spacer{height:112px}
.nav-gap{height:10px}

/* Navigation bar with scroll-edge effect */
.navbar{position:absolute;top:0;left:0;right:0;z-index:5;height:98px;padding:54px 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.navbar::before{content:"";position:absolute;inset:0 0 -16px 0;z-index:-1;opacity:0;transition:opacity .2s;background:var(--bar);
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.page.scrolled .navbar::before{opacity:1}
.nav-title{font:600 var(--fs-headline)/22px var(--font);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;transition:opacity .2s}
.page.scrolled .nav-title,.navbar.inline .nav-title{opacity:1}
.nav-l{justify-self:start}.nav-r{justify-self:end}
.large-title{font:700 var(--fs-large-title)/1.2 var(--font);letter-spacing:.37px;margin:0;padding:0 var(--inset) 14px}
.glass-btn{width:44px;height:44px;padding:0;border-radius:22px;border:0;display:grid;place-items:center;color:var(--label);
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--glass-stroke),0 0 0 .5px var(--glass-edge),0 4px 12px rgba(0,0,0,.08)}

/* ---------- iPhone Duo (foldable) ----------------------------------------------------------------
   Outer display 466×678 pt (compact width), inner display 951×669 pt open in landscape (regular width).
   Per Apple's Duo guidance: tab bar, toolbars, Back and the status bar move to a vertical bar on the RIGHT edge
   (same physical side in RTL); the Dynamic Island sits vertically in the upper-right corner; the inner display
   splits into two columns that meet at the fold. */
.cols,.col-a,.col-b{display:contents}
.screen[data-dev="duo-closed"]{width:466px;height:678px;border-radius:46px;--rail:76px;--rail-top:132px}
.screen[data-dev="duo-open"]{width:951px;height:669px;border-radius:36px;--rail:76px;--rail-top:80px;--fold:475.5px}
.island.island-v{top:12px;right:21px;left:auto;margin-left:0;width:34px;height:50px;border-radius:17px}
.crease{position:absolute;top:0;bottom:0;left:var(--fold);width:14px;margin-left:-7px;z-index:95;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.035) 45%,rgba(255,255,255,.05) 55%,transparent)}
.screen[data-dev^="duo"] .status-bar{top:68px;right:12px;left:auto;width:52px;height:52px;border-radius:50%;flex-direction:column;justify-content:center;gap:0;
  font:600 13px/1 var(--font);letter-spacing:-.2px}
.screen[data-dev="duo-open"] .status-bar{top:14px}
.screen[data-dev^="duo"] .sb-time{width:auto;padding:0}
.screen[data-dev^="duo"] .sb-gap{display:none}
.screen[data-dev^="duo"] .sb-icons{width:auto;padding:0;gap:4px;transform:scale(.56);margin:-2px -14px -4px}
/* Content stops at the bar column */
.screen[data-dev^="duo"] .main>.page{right:var(--rail)}
.screen[data-dev^="duo"] .edge{display:none}
.screen[data-dev^="duo"] .root-page .scroll{padding-top:14px}
.screen[data-dev^="duo"] .tab-spacer{height:28px}
/* Vertical bars: gear + page chips (icon only), then the tab bar at the bottom */
.screen[data-dev^="duo"] .topbar{top:var(--rail-top);left:auto;right:12px;flex-direction:column;width:var(--bar-h)}
.screen[data-dev^="duo"] .root-page{overflow:hidden}
.screen[data-dev^="duo"] .chips{flex-direction:column}
.screen[data-dev^="duo"] .chip{width:var(--bar-h);padding:0;justify-content:center}
.screen[data-dev^="duo"] .chip-txt{display:none}
.screen[data-dev^="duo"] .tabbar{top:auto;left:auto;right:6px;bottom:16px;width:64px;height:auto;flex-direction:column;gap:2px;border-radius:32px}
.screen[data-dev^="duo"] .tab{flex:none;height:58px;padding:0 2px;font-size:9.5px;border-radius:28px}
/* Pushed pages: Back moves to the top of the bar column */
.screen[data-dev^="duo"] .navbar{height:58px;padding:8px 12px 0}
.screen[data-dev^="duo"] .navbar .nav-l{position:absolute;top:var(--rail-top);right:calc(16px - var(--rail))}
.screen[data-dev^="duo"] .page:not(.root-page) .scroll{padding-top:58px}
.screen[data-dev^="duo"] .toast{bottom:28px;left:calc((100% - var(--rail))/2)}
.screen[data-dev="duo-closed"] .sheet{top:14px;right:var(--rail)}
.screen[data-dev="duo-closed"] .onb{padding-top:14px;padding-right:var(--rail)}
/* Inner display: two columns meeting at the fold (the fold is on the right half's start in RTL as well) */
.screen[data-dev="duo-open"] .cols{display:flex;align-items:flex-start}
.screen[data-dev="duo-open"] .col-a{display:block;flex:0 0 var(--fold);min-width:0}
.screen[data-dev="duo-open"][dir="rtl"] .col-a{flex-basis:calc(100% - var(--fold))}
.screen[data-dev="duo-open"] .col-b{display:block;flex:1 1 0;min-width:0;padding-inline:8px}
.screen[data-dev="duo-open"] .home .cols{min-height:610px;align-items:center}
.screen[data-dev="duo-open"] .home .col-b{padding-top:6px}
.screen[data-dev="duo-open"] .qibla{padding:0}
.screen[data-dev="duo-open"] .qibla .cols{width:100%;min-height:600px;align-items:center}
.screen[data-dev="duo-open"] .qibla .col-a{display:flex;flex-direction:column;align-items:center}
.screen[data-dev="duo-open"] .qibla .col-b{padding:0 28px}
.screen[data-dev="duo-open"] .qibla .compass{margin:20px 0 16px}
.screen[data-dev="duo-open"] .page:not(.root-page) .scroll{padding-inline:calc((100% - 600px)/2)}
.screen[data-dev="duo-open"] .sheet{top:36px;bottom:36px;left:calc(50% - 300px);right:auto;width:600px;border-radius:var(--r-sheet)}
.screen[data-dev="duo-open"].sheet-open .app-layer{transform:none;border-radius:0;filter:brightness(.7)}
.screen[data-dev="duo-open"] .alert-backdrop{justify-content:flex-end;padding-right:calc((100% - var(--fold) - 270px)/2)}
.screen[data-dev="duo-open"] .onb{padding-top:14px;padding-right:var(--rail)}
.screen[data-dev="duo-open"] .onb-page{padding-inline:150px}
.screen[data-dev="duo-open"] .onb-actions{padding:10px 210px 26px}

/* ---------- 4) COMPONENTS ------------------------------------------- */
/* Inset grouped list */
.group-wrap{margin:0 var(--inset) var(--sp-8)}
.group-header{font:400 var(--fs-footnote)/18px var(--font);letter-spacing:-.08px;text-transform:uppercase;color:var(--label-2);margin:0 16px 7px}
.group{background:var(--bg-cell);border-radius:var(--r-group);overflow:hidden}
.group-footer{font:400 var(--fs-footnote)/1.38 var(--font);letter-spacing:-.08px;color:var(--label-2);margin:7px 16px 0}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:var(--row-min);padding:11px 16px;border:0;
  background:transparent;color:var(--label);font:inherit;letter-spacing:inherit;text-align:start;line-height:1.3}
.group>.row:not([hidden])~.row::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:.5px;background:var(--separator)}
.group>.row.has-ic:not([hidden])~.row.has-ic::before{inset-inline-start:52px}
button.row:active:not(:disabled){background:var(--fill-4)}
button.row:disabled{color:var(--label-3)}
.row:focus-visible{outline-offset:-3px;border-radius:var(--r-group)}
.row-label{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.row-sub{display:block;font-size:var(--fs-footnote);color:var(--label-2);margin-top:2px;line-height:1.3;letter-spacing:-.08px}
.row-value{flex:0 1 auto;max-width:52%;color:var(--label-2);text-align:end;overflow-wrap:anywhere}
.row-ic{width:24px;display:grid;place-items:center;color:var(--accent);flex:none}
.row .chev{color:var(--label-3)}
.row-link{color:var(--accent)}
.row-link.destructive{color:var(--red)}
.check{width:20px;flex:none;color:var(--accent);display:grid;place-items:center}
.no-results .row-label{color:var(--label-2)}

/* Switch */
.switch{position:relative;flex:none;width:51px;height:31px;padding:0;border:0;border-radius:16px;background:var(--fill-1);transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .32s var(--ease-bounce)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(calc(20px * var(--dx)))}
.switch:disabled{opacity:.45}

/* Stepper (− | +) */
.stepper{flex:none;display:flex;height:32px;border-radius:8px;background:var(--fill-3)}
.stepper button{position:relative;width:47px;height:32px;border:0;background:transparent;color:var(--label);display:grid;place-items:center;border-radius:8px}
.stepper button::after{content:"";position:absolute;inset:-6px 0}          /* 44pt hit area */
.stepper button+button::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:1px;background:var(--separator)}
.stepper button:disabled{color:var(--label-3)}
.stepper button:active:not(:disabled){background:var(--fill-2)}

/* Segmented control */
.seg{flex:none;display:flex;padding:2px;border-radius:9px;background:var(--fill-3)}
.seg button{min-width:44px;height:30px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--label);
  font:500 13px var(--font);display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.seg button[aria-checked="true"]{background:var(--seg-thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* Search field */
.searchbar{display:flex;align-items:center;gap:6px;height:38px;margin:0 var(--inset) 18px;padding:0 10px;border-radius:12px;background:var(--fill-3);color:var(--label-2)}
.searchbar input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--label);font-size:var(--fs-body);outline:none}
.searchbar input::placeholder{color:var(--label-2)}
.searchbar:focus-within{box-shadow:0 0 0 2px var(--accent)}
.searchbar input::-webkit-search-cancel-button{filter:grayscale(1)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border:0;border-radius:var(--r-button);
  font:600 var(--fs-body)/1.2 var(--font);letter-spacing:-.41px;transition:transform .2s var(--ease-bounce),opacity .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-plain{background:transparent;color:var(--accent);font-weight:500}
.link-btn,.text-btn{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--accent);font-size:var(--fs-body)}
.inline-link{display:inline;padding:0;border:0;background:none;color:var(--accent);font:600 inherit/inherit var(--font);letter-spacing:inherit;text-decoration:none}
.icon-btn{position:relative;width:32px;height:32px;border:0;border-radius:50%;background:var(--fill-3);color:var(--label-2);display:grid;place-items:center}
.icon-btn::after{content:"";position:absolute;inset:-6px}
.tag{font:500 var(--fs-caption1)/1 var(--font);letter-spacing:0;color:var(--label-2);background:var(--fill-3);padding:4px 7px;border-radius:var(--r-pill)}

/* Sheet */
.sheet-backdrop{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.18);transition:opacity var(--dur-sheet)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;z-index:30;display:flex;flex-direction:column;overflow:hidden;
  --bg-grouped:var(--bg-grouped-el);--bg-cell:var(--bg-cell-el);background:var(--bg-grouped);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.16);
  transition:transform var(--dur-sheet) var(--ease-spring)}
.screen.opening .sheet,.screen.closing .sheet{transform:translateY(100%)}
.screen.opening .sheet-backdrop,.screen.closing .sheet-backdrop{opacity:0}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0;flex:none}
.sheet-nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:50px;padding:0 12px}
.sheet-nav .sn-l{justify-self:start}.sheet-nav .sn-r{justify-self:end}
.sheet-title{margin:0;font:600 var(--fs-headline)/22px var(--font);text-align:center}
.sheet-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 0 40px}
.sheet-scroll::-webkit-scrollbar{display:none}

/* System alert */
.alert-backdrop{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22);transition:opacity .22s}
.alert{width:272px;overflow:hidden;border-radius:14px;text-align:center;background:var(--alert-bg);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);transition:transform .32s var(--ease-bounce),opacity .2s}
.screen.alert-opening .alert{transform:scale(1.15);opacity:0}
.screen.alert-opening .alert-backdrop,.screen.alert-closing .alert-backdrop{opacity:0}
.screen.alert-closing .alert{opacity:0;transform:scale(.96)}
.alert-body{padding:19px 16px 16px}
.alert h3{margin:0 0 3px;font:600 17px/22px var(--font)}
.alert p{margin:0;font:13px/17px var(--font);letter-spacing:-.08px}
.alert-btns.row2{display:flex}
.alert-btn{flex:1;display:block;width:100%;min-height:44px;border:0;border-top:.5px solid var(--separator);background:transparent;color:var(--blue);font:400 17px/22px var(--font)}
.alert-btns.row2 .alert-btn+.alert-btn{border-inline-start:.5px solid var(--separator)}
.alert-btn.bold{font-weight:600}
.alert-btn:focus-visible{outline-offset:-3px}

/* Toast / HUD */
.toast{position:absolute;bottom:100px;left:50%;z-index:85;display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--r-pill);
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--glass-stroke),var(--shadow-float);font:600 var(--fs-subhead)/1.2 var(--font);white-space:nowrap;
  transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--ease-spring)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast:empty{display:none}

/* ---------- 5) SCREENS ---------------------------------------------- */
/* Onboarding */
.onb{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px;background:var(--bg)}
.onb-top{height:44px;display:flex;justify-content:flex-end;padding:0 8px}
.onb-viewport{flex:1;overflow:hidden;position:relative}
.onb-track{display:flex;height:100%;transition:transform .55s var(--ease-spring)}
.onb-page{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 34px 30px;text-align:center}
.onb-page h1{margin:30px 0 12px;font:700 var(--fs-title1)/1.2 var(--font);letter-spacing:.36px}
.onb-page p{margin:0;font-size:var(--fs-body);line-height:1.42;color:var(--label-2)}
.onb-badge{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.onb-dots{display:flex;justify-content:center;align-items:center;gap:8px;height:24px}
.dot{width:7px;height:7px;border-radius:4px;background:var(--label-4);transition:width .35s var(--ease-spring),background .35s}
.dot.on{width:20px;background:var(--accent)}
.onb-actions{display:flex;flex-direction:column;gap:4px;padding:14px 24px 46px}

/* App icon (brand mark: day arc + sun) */
.app-icon{flex:none;width:62px;height:62px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(165deg,color-mix(in srgb,var(--accent-l) 62%,#fff) 0%,var(--accent-l) 52%,color-mix(in srgb,var(--accent-l) 68%,#000) 100%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.app-icon.sm{width:38px;height:38px;border-radius:9px}
.app-icon.xl{width:112px;height:112px;border-radius:25px;box-shadow:0 14px 34px color-mix(in srgb,var(--accent-l) 38%,transparent)}

/* Home */
.home-head{text-align:center;padding:10px 16px 0}
.city-btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:2px 10px;border:0;border-radius:12px;background:transparent;
  color:var(--label);font:600 var(--fs-title2)/1.25 var(--font);letter-spacing:.35px}
.city-btn:active{background:var(--fill-4)}
.city-btn .loc-ic{color:var(--accent)}
.home-date{margin:0;font-size:var(--fs-subhead);line-height:1.38;letter-spacing:-.24px;color:var(--label-2)}
.hint-pill{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:5px 11px;border-radius:var(--r-pill);background:var(--fill-3);
  color:var(--label-2);font:500 var(--fs-footnote)/1.25 var(--font);letter-spacing:-.08px}
.banner{display:flex;align-items:center;gap:10px;margin:14px var(--inset) 0;padding:4px 6px 4px 14px;border-radius:var(--r-group);
  background:var(--bg-cell);font-size:var(--fs-subhead);line-height:1.3;letter-spacing:-.24px}
.banner>span{flex:1}
.banner .text-btn{font-weight:600;font-size:var(--fs-subhead)}

.hero{position:relative;width:358px;height:180px;margin:10px auto 8px}
.hero.no-arc{height:auto;padding:26px 0 22px}
/* Day arc – thick track, prayer markers with icons, time labels outside the curve */
.arc{position:absolute;left:0;top:0;overflow:visible}
.arc-track{fill:none;stroke:var(--arc-track);stroke-width:12;stroke-linecap:round}
.arc-done{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.pm{color:var(--accent)}
.pm-c{fill:var(--arc-track)}
.pm.is-passed,.pm.is-current{color:var(--on-accent)}
.pm.is-passed .pm-c,.pm.is-current .pm-c{fill:var(--accent)}
.pm-glow{fill:var(--accent);opacity:.16}
.pm.is-tight .pm-c{stroke:var(--bg-grouped);stroke-width:3;paint-order:stroke}  /* two prayers close together (e.g. Maghrib → Isha in the tropics) */
.arc-t{font:600 calc(12px*min(var(--ts),1.2)) var(--font);letter-spacing:.1px;fill:var(--label-2);font-variant-numeric:tabular-nums}
.arc-t.is-cur{fill:var(--accent);font-weight:700}
.arc-now circle{fill:#FFFFFF;stroke:rgba(0,0,0,.06);stroke-width:.5}
.arc-now{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.arc-k{fill:none;stroke:var(--kerahat);stroke-width:3;stroke-linecap:round;opacity:.5}
.arc-k.is-now{opacity:.95}
/* Prayer rows: Kerahat caption under the name (Sunrise, Dhuhr, Asr) */
.prow-sub{flex-basis:100%;display:flex;align-items:flex-start;gap:5px;margin-top:-1px;font:400 var(--fs-caption1)/1.25 var(--font);letter-spacing:0;color:var(--label-2);font-variant-numeric:tabular-nums}
.prow.is-current .prow-sub{color:var(--label-2);font-weight:400}
.prow-sub .nw{white-space:nowrap}
.k-dot{flex:none;margin-top:calc(.62em - 2.5px);width:5px;height:5px;border-radius:50%;background:var(--kerahat);opacity:.75}
.prow .prow-sub.is-now{color:var(--kerahat-text)}
.prow-sub.is-now .k-dot{opacity:1}
.hero-text{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.hero.no-arc .hero-text{position:static}
.hero-label{font:500 var(--fs-subhead)/1.3 var(--font);letter-spacing:-.24px;color:var(--label-2)}
.hero-count{font:200 var(--fs-countdown)/1.05 var(--font-display);letter-spacing:-1.2px;font-variant-numeric:tabular-nums;color:var(--label)}
.hero-count.wide{font-size:calc(var(--fs-countdown)*.86)}
.hero:not(.no-arc) .hero-count:not(.is-text){font-size:calc(56px*min(var(--ts),1.05))}
.hero:not(.no-arc) .hero-count.wide{font-size:calc(50px*min(var(--ts),1.05))}
.hero:not(.no-arc) .hero-count.is-text{font-size:calc(32px*min(var(--ts),1.1));padding:0 0 8px}
.hero-count.is-text{font-weight:300;font-size:calc(40px*min(var(--ts),1.15));letter-spacing:-.6px;padding:6px 0}

.prayers{list-style:none;margin:8px var(--inset) 0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{position:relative;display:flex;align-items:center;gap:12px;min-height:var(--row-h);padding-inline:16px 4px;border-radius:var(--r-row);
  background:var(--bg-cell);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .3s,box-shadow .3s}


.prow-ic{width:24px;display:grid;place-items:center;flex:none;color:var(--label-2)}
.prow-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prow-time{font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.prow.is-passed .prow-name,.prow.is-passed .prow-time{color:var(--label-2)}
.prow.is-passed .prow-ic{color:var(--label-3)}
.prow.is-current{background:color-mix(in srgb,var(--accent) 15%,var(--bg-cell));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 20%,transparent)}
.prow.is-current .prow-name,.prow.is-current .prow-time{color:var(--accent);font-weight:600}
.prow.is-current .prow-ic,.prow.is-current .bell{color:var(--accent)}
.now-chip{font:700 var(--fs-caption2)/1 var(--font);letter-spacing:.4px;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--accent);color:var(--on-accent)}
.hl-mark{color:var(--accent);display:inline-grid}
.bell{width:44px;height:44px;flex:none;border:0;border-radius:22px;background:transparent;color:var(--label-2);display:grid;place-items:center}
.bell[data-state="off"]{color:var(--label-3)}
.bell:active{background:var(--fill-4)}
.bell.pop svg{animation:pop .45s var(--ease-bounce)}
@keyframes pop{0%{transform:scale(.6) rotate(-14deg)}60%{transform:scale(1.12) rotate(6deg)}100%{transform:none}}
.screen[data-density="compact"]{--row-h:44px}
.screen[data-density="compact"] .prayers{gap:6px}
.note{display:flex;gap:10px;margin:12px var(--inset) 0;padding:12px 14px;border-radius:var(--r-group);background:var(--bg-cell);
  font-size:var(--fs-footnote);line-height:1.4;letter-spacing:-.08px;color:var(--label-2)}
.note strong{display:block;margin-bottom:2px;color:var(--label);font-size:var(--fs-subhead);letter-spacing:-.24px}
.note .ic{margin-top:1px}

/* Verses & make-up (Qada) */
.page-title{margin:2px 0 14px;padding:0 var(--inset);font:700 var(--fs-large-title)/1.2 var(--font);letter-spacing:.37px}
.lede{margin:-6px var(--inset) 18px;font-size:var(--fs-subhead);line-height:1.4;letter-spacing:-.24px;color:var(--label-2)}
.card{margin:0 var(--inset) 10px;padding:20px;border-radius:var(--r-group);background:var(--bg-cell)}
.card-foot{margin:0 calc(var(--inset) + 16px) 8px;font-size:var(--fs-footnote);line-height:1.38;letter-spacing:-.08px;color:var(--label-2)}
.card-eyebrow{display:flex;justify-content:space-between;gap:8px;font:600 var(--fs-caption1)/1.2 var(--font);letter-spacing:.4px;text-transform:uppercase;color:var(--label-2)}
.verse-ar{margin:14px 0 12px;direction:rtl;text-align:right;letter-spacing:0;color:var(--label);
  font:400 calc(29px*var(--ts))/1.85 "SF Arabic","Geeza Pro","Noto Naskh Arabic","Amiri","Times New Roman",serif}
.verse-tr{margin:0;font-size:var(--fs-body);line-height:1.45}
.verse-ref{margin-top:10px;font:600 var(--fs-subhead)/1.3 var(--font);letter-spacing:-.24px;color:var(--accent)}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:var(--r-pill);background:var(--fill-3);
  color:var(--label);font:600 var(--fs-subhead)/1 var(--font);letter-spacing:-.24px}
.pill-btn:active{background:var(--fill-2)}
.section-h{margin:24px var(--inset) 10px;font:700 var(--fs-title3)/1.25 var(--font);letter-spacing:.38px}
.vlist,.qrows{display:flex;flex-direction:column;gap:8px;margin:0 var(--inset)}
.vitem{display:block;width:100%;padding:13px 16px;border:0;border-radius:var(--r-row);background:var(--bg-cell);color:var(--label);text-align:start;font:inherit;letter-spacing:inherit}
.vitem[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 13%,var(--bg-cell))}
.vitem-date{font-size:var(--fs-footnote);color:var(--label-2)}
.vitem-tr{display:-webkit-box;margin:3px 0;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:var(--fs-subhead);line-height:1.35}
.vitem-ref{font:600 var(--fs-footnote)/1.3 var(--font);color:var(--accent)}
.qsum{text-align:center;padding:22px 20px 18px}
.qsum-num{font:700 calc(56px*min(var(--ts),1.2))/1.05 var(--font-rounded);letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--accent)}
.qsum-unit{margin-top:2px;font-size:var(--fs-subhead);color:var(--label-2)}
.qbar{height:8px;margin:18px 0 10px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s var(--ease-spring)}
.qsum-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:var(--fs-footnote);color:var(--label-2);font-variant-numeric:tabular-nums}
.qrow{display:flex;align-items:center;gap:12px;min-height:var(--row-h);padding:6px 10px 6px 16px;border-radius:var(--r-row);background:var(--bg-cell)}
.qrow .row-label{flex:1}
.qrow .num{min-width:52px;text-align:end;font:600 var(--fs-headline)/1.2 var(--font);font-variant-numeric:tabular-nums}
.qrows+.group-wrap,.qrows+.section-h{margin-top:24px}

/* Prayer guide ("Anleitung") */
.seg-wide{display:flex;margin:4px var(--inset) 14px}
.seg-wide button{flex:1 1 0;min-width:0;padding:0 2px;font-size:calc(13px*min(var(--ts),1.2))}
.cur-dot{display:inline-block;width:6px;height:6px;margin-inline-start:4px;border-radius:50%;background:var(--accent);vertical-align:1px}
.g-head{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
.g-ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.g-title{margin:0;font:700 var(--fs-title1)/1.15 var(--font);letter-spacing:.36px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{padding:10px 11px 11px;border-radius:14px;background:var(--fill-4)}
.fact b{display:block;font:600 var(--fs-subhead)/1.25 var(--font);letter-spacing:-.24px}
.fact b.big{font:700 var(--fs-title2)/1.1 var(--font-rounded)}
.fact span{display:block;margin-top:3px;font-size:var(--fs-caption1);line-height:1.25;color:var(--label-2)}
.rak{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 6px;margin-top:18px}
.rak-unit{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:38px}
.rak-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 15px/1 var(--font-rounded)}
.rak-unit.silent .rak-dot{background:var(--accent-tint);color:var(--accent)}
.rak-sub{font-size:var(--fs-caption2);color:var(--label-2)}
.rak-sit{margin-top:7px;padding:4px 9px;border-radius:var(--r-pill);background:var(--fill-3);font:600 var(--fs-caption2)/1.3 var(--font);color:var(--label-2);white-space:nowrap}
.g-note{margin:12px 0 0;font-size:var(--fs-footnote);line-height:1.38;color:var(--label-2)}
.g-now{margin-top:14px}
.steps{display:flex;flex-direction:column;gap:8px;margin:0 var(--inset);padding:0;list-style:none}
.step{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:var(--r-row);background:var(--bg-cell)}
.step>div{flex:1;min-width:0}
.pose{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.pose.sm{width:42px;height:42px;border-radius:50%}
.step h3{margin:0 0 3px;font:600 var(--fs-headline)/1.3 var(--font);letter-spacing:-.3px}
.step h3 .n{margin-inline-end:6px;font-weight:500;color:var(--label-2)}
.step p{margin:0;font-size:var(--fs-subhead);line-height:1.4;letter-spacing:-.24px;color:var(--label-2)}
.step .pill-btn{margin-top:10px}
.formula{margin-top:9px;padding:8px 11px;border-radius:12px;background:var(--fill-4)}
.formula .ar{display:block;direction:rtl;text-align:right;color:var(--label);font:400 calc(21px*var(--ts))/1.6 "SF Arabic","Geeza Pro","Noto Naskh Arabic","Amiri",serif}
.formula .lat{display:block;font-size:var(--fs-subhead);font-style:italic;color:var(--label)}
.repeat{display:flex;align-items:center;gap:10px;padding:11px 16px;border:1.5px dashed var(--separator);border-radius:var(--r-row);font-size:var(--fs-footnote);color:var(--label-2)}

/* Settings extras */
.tagline{display:flex;flex-direction:column;align-items:center;gap:8px;margin:-6px 0 0;color:var(--label-2);font-size:var(--fs-footnote)}
.tagline .app-icon{width:34px;height:34px;border-radius:8px}
.prose{padding:6px 28px 24px;text-align:center}
.prose h2{margin:22px 0 10px;font:700 var(--fs-title2)/1.25 var(--font);letter-spacing:.35px}
.prose p{margin:0 0 12px;line-height:1.45;color:var(--label-2)}
.prose .onb-badge{margin:0 auto}

/* Adhan player */
.player{margin:4px var(--inset) 30px;padding:22px 18px 22px;border-radius:var(--r-card);background:var(--bg-cell);text-align:center}
.player-title{font:600 var(--fs-title3)/1.25 var(--font);letter-spacing:.38px}
.player-sub{margin-top:3px;font-size:var(--fs-subhead);color:var(--label-2);letter-spacing:-.24px}
.wave{display:flex;align-items:center;justify-content:space-between;gap:2px;height:64px;margin:22px 0 14px}
.wave i{flex:1;max-width:4px;height:calc(var(--h)*100%);border-radius:2px;background:var(--label-4);transform:scaleY(.62);transition:background .2s}
.wave i.on{background:var(--accent)}
.wave.playing i{animation:wv 1.15s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes wv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.scrub{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:0;background:transparent;--pct:0%}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--pct),var(--fill-1) var(--pct))}
[dir="rtl"] .scrub::-webkit-slider-runnable-track{background:linear-gradient(270deg,var(--accent) var(--pct),var(--fill-1) var(--pct))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--fill-1)}
.scrub::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.scrub::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.times{display:flex;justify-content:space-between;margin-top:4px;font:500 var(--fs-caption1)/1 var(--font);color:var(--label-2);font-variant-numeric:tabular-nums}
.play-btn{width:72px;height:72px;margin:16px auto 0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);
  transition:transform .25s var(--ease-bounce)}
.play-btn:active{transform:scale(.9)}

/* Qibla */
.qibla{display:flex;flex-direction:column;align-items:center;padding:0 var(--inset)}
.q-readout{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.q-deg{font:200 calc(56px*min(var(--ts),1.2))/1 var(--font-display);letter-spacing:-1px}
.q-dir{font:500 var(--fs-title3)/1 var(--font);color:var(--label-2)}
.compass{position:relative;width:280px;height:280px;margin:40px 0 20px;border-radius:50%;touch-action:none;cursor:grab}
.compass:active{cursor:grabbing}
.compass:focus-visible{outline-offset:14px;border-radius:50%}
.compass .dial{display:block;width:100%;height:100%;overflow:visible}
.lubber{position:absolute;top:-18px;left:50%;width:3px;height:26px;margin-left:-1.5px;border-radius:2px;background:var(--label);z-index:2;transition:background .2s}
.compass.aligned .lubber{background:var(--accent)}
.compass.pulse{animation:qpulse .8s ease-out}
@keyframes qpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.tick{stroke:var(--label-3);stroke-width:1.2}
.tick.major{stroke:var(--label-2);stroke-width:2}
.lbl{fill:var(--label-2);font:500 11px var(--font);transform:rotate(calc(var(--h,0deg) - var(--q,0deg)));transform-box:fill-box;transform-origin:center}
.lbl.card{fill:var(--label);font:600 18px var(--font)}
.lbl.north{fill:var(--red)}
.q-needle{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.q-head{fill:var(--accent)}
.kaaba{fill:var(--label)} .kaaba-band{stroke:var(--accent);stroke-width:2}
.upright{transform:rotate(calc(var(--h,0deg) - var(--q,0deg)));transform-box:fill-box;transform-origin:center}
.c-center{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--label)}
.q-status{display:flex;align-items:center;gap:6px;min-height:26px;margin:0;font:600 var(--fs-headline)/1.3 var(--font)}
.q-status.ok{color:var(--accent)}
.q-info{margin:6px 0 24px;text-align:center;font-size:var(--fs-subhead);letter-spacing:-.24px;color:var(--label-2)}
.calib{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:var(--r-group);background:var(--bg-cell);
  font-size:var(--fs-footnote);line-height:1.38;letter-spacing:-.08px;color:var(--label-2)}
.calib strong{display:block;margin-bottom:2px;color:var(--label);font-size:var(--fs-subhead);font-weight:600;letter-spacing:-.24px}
.calib .ic{color:var(--accent)}

/* ---------- 6) WIDGETS & NOTIFICATIONS ------------------------------ */
.gallery{background:#000;color:#fff}
.gallery .status-bar{color:#fff}
.gallery .home-ind{background:#fff}
.wall{position:absolute;inset:0;
  background:radial-gradient(120% 70% at 15% 0%,#a9dccf 0%,transparent 58%),
             radial-gradient(110% 80% at 100% 100%,#f0c6a2 0%,transparent 55%),
             linear-gradient(180deg,#2f7476 0%,#1d4d5c 46%,#24304f 100%)}
.gallery[data-theme="dark"] .wall{filter:brightness(.55) saturate(1.1)}
.ls-lock{position:absolute;top:58px;left:50%;transform:translateX(-50%);opacity:.9}
.ls-date{position:absolute;top:84px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;
  font:600 19px/24px var(--font-display);letter-spacing:.2px;text-shadow:0 1px 12px rgba(0,0,0,.12)}
.ls-inline{display:inline-flex;align-items:center;gap:4px;opacity:.88;font-variant-numeric:tabular-nums}
.ls-time{position:absolute;top:106px;left:0;right:0;text-align:center;font:700 98px/1 var(--font-rounded);letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 20px rgba(0,0,0,.12)}
.ls-widgets{position:absolute;top:226px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.acc{color:#fff;background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2)}
.acc-circ{position:relative;width:72px;height:72px;border-radius:50%}
.acc-ring{position:absolute;inset:0;width:72px;height:72px}
.ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:5}
.ring-fg{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
.acc-circ-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 13px/1 var(--font-rounded);font-variant-numeric:tabular-nums}
.acc-rect{width:170px;height:72px;border-radius:18px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  font:500 13px/1.25 var(--font);text-align:start}
.ar-1{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px}
.ar-2{font-variant-numeric:tabular-nums}
.ar-3{opacity:.68;font-variant-numeric:tabular-nums}
.ls-btn{position:absolute;bottom:46px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(0,0,0,.26);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.ls-btn.l{inset-inline-start:46px}.ls-btn.r{inset-inline-end:46px}
.n-stack{position:absolute;left:10px;right:10px;bottom:116px;display:flex;flex-direction:column;gap:8px}
.notif{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 13px;border-radius:22px;text-align:start;color:var(--n-fg);background:var(--n-bg);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.gallery[data-theme="light"] .notif{--n-bg:rgba(250,250,250,.74);--n-fg:#000}
.gallery[data-theme="dark"] .notif{--n-bg:rgba(28,28,30,.66);--n-fg:#fff}
.n-main{flex:1;min-width:0}
.n-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 15px/20px var(--font);letter-spacing:-.24px}
.n-head time{flex:none;font:400 13px var(--font);opacity:.55}
.notif p{margin:1px 0 0;font:400 15px/20px var(--font);letter-spacing:-.24px}
.n-caption{position:absolute;left:0;right:0;bottom:92px;text-align:center;font:500 12px var(--font);opacity:.7}

/* Live Activity – Lock Screen banner (accent background, white arc) */
.la{position:absolute;left:12px;right:12px;bottom:112px;padding:11px 14px 8px;border-radius:24px;color:#fff;text-align:start;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent-l) 82%,#fff) 0%,var(--accent-l) 50%,color-mix(in srgb,var(--accent-l) 78%,#000) 100%);
  box-shadow:0 8px 26px rgba(0,0,0,.2)}
.la-head{display:flex;justify-content:space-between;align-items:center;font:600 13px/16px var(--font);letter-spacing:-.08px}
.la-app{display:inline-flex;align-items:center;gap:5px}
.la-city{opacity:.72;font-weight:500}
.la-arc{position:relative;width:330px;height:122px;margin:-2px auto 0}
.la-text{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.la-name{font:600 13px/16px var(--font);opacity:.86;font-variant-numeric:tabular-nums}
.la-count{font:700 30px/1.05 var(--font-rounded);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.arc-la .arc-track{stroke:rgba(255,255,255,.28);stroke-width:7}
.arc-la .arc-done{stroke:#fff;stroke-width:7}
.arc-la .pm{color:#fff}
.arc-la .pm-c{fill:color-mix(in srgb,#fff 30%,var(--accent-l))}
.arc-la .pm.is-passed,.arc-la .pm.is-current{color:var(--accent-l)}
.arc-la .pm.is-passed .pm-c,.arc-la .pm.is-current .pm-c{fill:#fff}
.arc-la .pm-glow{fill:#fff;opacity:.22}
.arc-la .pm.is-tight .pm-c{stroke:var(--accent-l)}
.arc-la .arc-t{font:600 10.5px var(--font);fill:rgba(255,255,255,.8)}
.arc-la .arc-t.is-cur{fill:#fff;font-weight:700}
.arc-la .arc-now{filter:none}
.arc-la .arc-now circle{fill:var(--accent-l);stroke:#fff;stroke-width:2}
.arc-la .arc-k{stroke:#F3C979;stroke-width:2;opacity:.75}
.arc-la .arc-k.is-now{opacity:1}
/* Live Activity – Dynamic Island */
.di{display:flex;align-items:center;justify-content:space-between;color:#fff;text-align:start}
.di-compact{width:212px;margin-left:-106px;padding:0 12px 0 11px}
.di-ic{display:grid;color:var(--accent-d)}
.di-cd{font:600 14px/1 var(--font);letter-spacing:-.2px;color:var(--accent-d);font-variant-numeric:tabular-nums}
.di-exp{top:9px;left:9px;right:9px;width:auto;height:auto;margin-left:0;border-radius:44px;flex-direction:column;align-items:stretch;justify-content:flex-start;
  padding:13px 24px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.di-top{display:flex;justify-content:space-between;align-items:center;height:26px;font:600 15px/20px var(--font);font-variant-numeric:tabular-nums}
.di-lead{display:inline-flex;align-items:center;gap:6px;color:var(--accent-d)}
.di-trail{display:inline-flex;align-items:center;gap:4px;font-weight:500;opacity:.65}
.di-cap{margin-top:8px;font:500 13px/16px var(--font);opacity:.62}
.di-big{font:600 38px/1.08 var(--font-rounded);letter-spacing:-.4px;color:var(--accent-d);font-variant-numeric:tabular-nums}
.di-bar{position:relative;height:6px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.18)}
.di-bar i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:3px;background:var(--accent-d)}
.di-bar b{position:absolute;bottom:-5px;height:2px;border-radius:1px;background:#E0A84F;opacity:.85}
.di-ends{display:flex;justify-content:space-between;margin-top:8px;font:500 12px/14px var(--font);opacity:.6;font-variant-numeric:tabular-nums}

.hs{position:absolute;top:66px;left:26px;right:26px;display:flex;flex-direction:column;gap:16px}
.hs-cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.hs-label{max-width:84px;font:500 11px/13px var(--font);letter-spacing:.06px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-icon{width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.ph-label{width:38px;height:6px;margin:3px 0 4px;border-radius:3px;background:rgba(255,255,255,.38)}
.hs-split{display:flex;justify-content:space-between;align-items:flex-start}
.hs-grid2{display:grid;grid-template-columns:62px 62px;column-gap:30px;row-gap:12px}
.hs-icons{display:flex;justify-content:space-between}
.hs-dots{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.hs-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.hs-dots i.on{background:#fff}
.dock{position:absolute;bottom:14px;left:14px;right:14px;height:90px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 12px;
  background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.w{overflow:hidden;text-align:start;background:var(--bg-cell);color:var(--label);border-radius:var(--r-widget);box-shadow:0 4px 18px rgba(0,0,0,.14);letter-spacing:-.2px}
.w-medium{width:338px;height:154px;display:flex;gap:14px;padding:14px 14px 14px 16px}
.w-small{width:154px;height:154px;display:flex;flex-direction:column;justify-content:space-between;padding:14px 15px}
.w-top{display:flex;justify-content:space-between;align-items:center}
.w-city{display:flex;align-items:center;gap:4px;font:600 13px/16px var(--font);color:var(--label-2)}
.w-city .ic{color:var(--accent)}
.w-cap{margin-top:auto;font:600 11px/13px var(--font);letter-spacing:.3px;text-transform:uppercase;color:var(--label-2)}
.w-name{font:600 17px/22px var(--font);color:var(--accent)}
.w-time{font:600 34px/38px var(--font-rounded);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.w-count{font:500 13px/16px var(--font);color:var(--label-2);font-variant-numeric:tabular-nums}
.wm-l{flex:none;width:118px;display:flex;flex-direction:column}
.wm-list{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin:0;padding:0;list-style:none}
.wm-list li{display:flex;justify-content:space-between;gap:6px;padding:1px 8px;border-radius:6px;font:500 13px/18px var(--font);font-variant-numeric:tabular-nums}
.wm-list li.passed{color:var(--label-3)}
.wm-list li.next{background:var(--accent-tint);color:var(--accent);font-weight:700}

/* ---------- 7) PROTOTYPE PANEL (not part of the app) ---------------- */
#panel{flex:none;width:300px;height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 18px 40px;
  background:var(--panel);border-inline-end:1px solid var(--separator);font-size:13px;line-height:1.35;letter-spacing:-.08px}
.pn-title{font:700 15px/1.2 var(--font);letter-spacing:-.2px}
.pn-sub{margin-top:3px;color:var(--label-2);font-size:12px}
.pn-sec{margin-top:20px}
.pn-sec h3{margin:0 0 8px;font:600 11px/1 var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--label-2)}
.pn-seg{display:flex;padding:2px;border-radius:8px;background:var(--fill-3)}
.pn-seg+.pn-seg,.pn-field+.pn-field{margin-top:8px}
.pn-seg button{flex:1;padding:6px 4px;border:0;border-radius:6px;background:transparent;color:var(--label);font:500 12px/1.2 var(--font)}
.pn-seg button[aria-pressed="true"]{background:var(--seg-thumb);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pn-field{display:block}
.pn-field>span{display:block;margin-bottom:4px;color:var(--label-2);font-size:12px}
.pn-select{width:100%;height:30px;padding:0 8px;border:1px solid var(--separator);border-radius:7px;background:var(--bg-cell);color:var(--label);font-size:13px}
.pn-range{width:100%;accent-color:var(--accent)}
.pn-readout{margin-top:4px;color:var(--label-2);font-size:12px;font-variant-numeric:tabular-nums}
.pn-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;cursor:pointer}
.pn-row small{display:block;color:var(--label-2);font-size:11px}
.pn-switch{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:36px;height:22px;margin:0;border-radius:11px;background:var(--fill-1);cursor:pointer;transition:background .2s}
.pn-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease-bounce)}
.pn-switch:checked{background:var(--accent)}
.pn-switch:checked::after{transform:translateX(14px)}
.swatches{display:flex;gap:10px}
.swatch{width:28px;height:28px;padding:0;border:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch[aria-pressed="true"]{outline:2px solid var(--label);outline-offset:2px}
.pn-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pn-btn{padding:7px 9px;border:0;border-radius:8px;background:var(--fill-3);color:var(--label);font:500 12px/1.2 var(--font);text-align:start}
.pn-btn:hover{background:var(--fill-2)}
.pn-note{margin-top:22px;color:var(--label-3);font-size:11px;line-height:1.45}
@media (max-width:860px){
  body{flex-direction:column}
  #panel{width:auto;height:auto;position:static;border-inline-end:0;border-bottom:1px solid var(--separator)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* RTL preview with LTR strings: wrap each string in a First-Strong-Isolate so its own word order
   survives inside the mirrored layout (like <bdi>). Real Arabic strings would not need this. */
const iso = s => S.rtl ? '\u2068' + s + '\u2069' : s;
function t(key, vars){
  const s0 = (T[S.lang] && T[S.lang][key] !== undefined) ? T[S.lang][key] : (T.en[key] !== undefined ? T.en[key] : key);
  if (typeof s0 !== 'string') return s0;
  return iso(vars ? s0.replace(/\{(\w+)\}/g, (m,k) => (vars[k] !== undefined ? vars[k] : m)) : s0);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60 + m; };
const num = x => new Intl.NumberFormat(LOC[S.lang]).format(x);
function fmt(min){ const m = ((Math.round(min) % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m % 60); }
function realSec(){ const d = new Date(); return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds(); }
function nowSec(){ const c = S.clock; return (((c.base + (Date.now() - c.anchor)/1000) % 86400) + 86400) % 86400; }
function fmtClock(ns = nowSec()){ return fmt(Math.floor(ns/60)); }
function fmtDur(s){ s = Math.max(0, s); return Math.floor(s/60) + ':' + pad(Math.floor(s % 60)); }
function cdDigital(sec){ sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function cdText(sec){ const tot = Math.max(1, Math.ceil(sec/60)), h = Math.floor(tot/60), m = tot % 60, out = [];
  if (h) out.push(`${h} ${t('hShort')}`); if (m || !h) out.push(`${m} ${t('mShort')}`); return out.join(' '); }
function appDate(){ return S.highLat ? new Date(...BERLIN_SUMMER.date, 12) : new Date(); }

/* Today's times in minutes from midnight (Isha may exceed 1440 = after midnight) */
function todayTimes(){
  const d = S.highLat ? BERLIN_SUMMER.times : CITIES[S.city].times;
  const pick = v => typeof v === 'object' ? v[S.hlRule] : v;
  const raw = {fajr:pick(d.fajr), sunrise:d.sunrise, dhuhr:d.dhuhr, asr:S.asr === 'hanafi' ? d.asrHanafi : d.asr, maghrib:d.maghrib, isha:pick(d.isha)};
  const out = {}; let prev = -Infinity;
  for (const p of PRAYERS){ let m = toMin(raw[p]) + (S.adj[p] || 0); if (p === 'isha' && m < prev) m += 1440; out[p] = m; prev = m; }
  return out;
}
/* Phase of the day: current prayer, next event, passed rows. Uses a 3-day event timeline
   so "before Fajr" and "after Isha" resolve correctly across midnight. */
function phase(ns){
  const tt = todayTimes(), ev = [];
  for (const d of [-1,0,1]) for (const p of PRAYERS) ev.push({p, d, at:(tt[p] + d*1440) * 60});
  ev.sort((a,b) => a.at - b.at);
  const i = ev.findIndex(e => e.at > ns);
  const next = ev[i], prev = ev[i-1], next2 = ev[i+1];
  const current = prev && prev.p !== 'sunrise' ? prev : null;           // sunrise ends Fajr
  const passed = {}; for (const p of PRAYERS) passed[p] = tt[p]*60 <= ns;
  return {t:tt, ns, next, next2, prev, current, passed, remaining:next.at - ns, span:next.at - prev.at};
}
function phaseKey(ph){ const k = activeKerahat(ph); return [ph.current ? ph.current.p + ph.current.d : '-', ph.next.p + ph.next.d, PRAYERS.map(p => ph.passed[p] ? 1 : 0).join(''), k ? k.id : '-'].join('|'); }

  else if (p && p.at) S.clock.base = ((p.at(todayTimes()) % 86400) + 86400) % 86400;
  else S.clock.base = cur;
}

function sub(s){ return s ? `<span class="row-sub">${s}</span>` : ''; }

/* --- Prayer guide: always opens on the prayer whose time it is now (or the next one between sunrise and Dhuhr) --- */
function guideState(ph){
  const auto = ph.current ? ph.current.p : (ph.next.p === 'sunrise' ? 'dhuhr' : ph.next.p);
  const p = S.guidePick || auto, isCur = !!(ph.current && ph.current.p === p);
  return {p, auto, isCur, isNext:!isCur && p === auto};
}
function guidePage(ph){
  const g = guideState(ph), p = g.p, r = RAKAH[p], name = t('p_' + p);
  const status = g.isCur ? t('now') : g.isNext ? t('guideNext') : '';
  const rec = r.loud.every(Boolean) ? t('recAloud') : r.loud.some(Boolean) ? t('recMixed') : t('recSilent');
  let rak = '';
  r.loud.forEach((l, i) => {
    rak += `<div class="rak-unit ${l ? '' : 'silent'}"><span class="rak-dot">${i + 1}</span><span class="rak-sub">${t(l ? 'recAloud' : 'recSilent')}</span></div>`;
    if (i === 1 && r.n > 2) rak += `<span class="rak-sit">${t('tashSit')}</span>`;
  });
  rak += `<span class="rak-sit">${t('tashEnd')}</span>`;
  const before = [['drop','b_wudu'],['sparkle','b_clean'],['compass','b_qibla'],['heart','b_niyya']].map(([icon, k]) =>
    `<li class="step"><span class="pose sm">${ic(icon,22)}</span><div><h3>${t(k)}</h3><p>${t(k + 'D',{p:name, n:r.n})}</p>${k === 'b_qibla'
      ? `<button class="pill-btn" data-act="tab" data-v="qibla" data-fkey="g-qibla">${ic('compass',18)}${t('b_qiblaBtn')}</button>` : ''}</div></li>`).join('');
  const steps = GUIDE_STEPS.map(([k, pose], i) => { const f = FORMULA[k];
    return `<li class="step"><span class="pose">${poseSvg(pose)}</span><div><h3><span class="n">${i + 1}</span>${t('s_' + k)}</h3><p>${t('s_' + k + 'D')}</p>${f
      ? `<div class="formula"><span class="ar" lang="ar" dir="rtl">${f.ar}</span><span class="lat">${f.lat}</span></div>` : ''}</div></li>`
      + (k === 'sujud' ? `<li class="repeat">${ic('qada',18)}<span>${t('repeatNote')}</span></li>` : ''); }).join('');
  return `<section class="pane-page"><div class="scroll" data-scroll="guide"><div class="cols"><div class="col-a">
    <div class="seg seg-wide" role="radiogroup" aria-label="${esc(t('guideChip'))}">${FIVE.map(x =>
      `<button role="radio" aria-checked="${x === p}" data-act="guide-pick" data-v="${x}" data-fkey="gp-${x}">${t('p_' + x)}${x === g.auto ? '<i class="cur-dot" aria-hidden="true"></i>' : ''}</button>`).join('')}</div>
    <article class="card">
      <div class="card-eyebrow"><span>${status}</span><span class="tabnum">${fmt(ph.t[p])}–${fmt(ph.t[NEXT_OF[p]])}</span></div>
      <div class="g-head"><span class="g-ic">${ic(PICON[p],24)}</span><h1 class="g-title">${name}</h1></div>

      </div>
      <div class="rak" role="img" aria-label="${esc(t('rakSeq') + ': ' + r.loud.map((l, i) => (i + 1) + ' ' + t(l ? 'recAloud' : 'recSilent')).join(', '))}">${rak}</div>
      ${r.n > 2 ? `<p class="g-note">${t('onlyFatiha')}</p>` : ''}
      ${S.guidePick && S.guidePick !== g.auto ? `<button class="pill-btn g-now" data-act="guide-now" data-fkey="g-now">${ic(PICON[g.auto],18)}${t('guideBack')}</button>` : ''}
    </article>

    <p class="card-foot" style="margin-top:16px">${t('guideFooter')}</p></div></div>

/* --- Make up missed prayers (Qada) --- */
function qadaKeys(){ return S.qada.witr ? [...FIVE, 'witr'] : FIVE; }
function qStepper(k, val, label, min, max, minusLabel, plusLabel){
  return `<div class="stepper" role="group" aria-label="${esc(label)}">
    <button data-act="qstep" data-k="${k}" data-d="-1" aria-label="${esc(minusLabel || t('stepLess',{x:label}))}" ${val <= min ? 'disabled' : ''} data-fkey="qs-${k}-m">${ic('minus',18)}</button>
    <button data-act="qstep" data-k="${k}" data-d="1" aria-label="${esc(plusLabel || t('stepMore',{x:label}))}" ${val >= max ? 'disabled' : ''} data-fkey="qs-${k}-p">${ic('plus',18)}</button></div>`;
}
function qadaPage(){
  const q = S.qada, keys = qadaKeys();
  const open = keys.reduce((n, k) => n + q.open[k], 0), total = keys.reduce((n, k) => n + q.tot[k], 0), done = Math.max(0, total - open);
  const pct = total ? done/total : 0, days = q.years*365 + q.months*30 + q.days;

/* --- Home --- */
/* Day arc: a thick circular arc (≈128°) from Fajr (left) to Isha (right). Each of the five prayers sits on it as an
   icon marker, placed by time: upcoming = tinted, begun = filled, current = larger with a glow. The solid part of the
   track is the time already passed; the white knob marks "now". Times sit outside the curve (below the two end markers).
   RTL is mirrored here in JS (not with a CSS flip) so the numbers stay readable. */
const ARCS = {
  home:{w:358, h:180, cx:179, cy:206, r:162, a0:.45, m:15, mc:17, is:16, isc:18, sw:2.1, glow:25, knob:7, lw:34, lh:13, gap:5, below:12, k:19},
  /* Live Activity on the Lock Screen: same drawing, smaller and flatter */
  la:  {w:330, h:122, cx:165, cy:190, r:166, a0:.6, m:10.5, mc:12, is:12, isc:13, sw:2.3, glow:17, knob:4.5, lw:28, lh:11, gap:3, below:9, k:13.5}
};
const arcAngle = (f, g = ARCS.home) => g.a0 + f*(Math.PI - 2*g.a0);
const arcPoint = (f, g = ARCS.home, rr = g.r) => { const a = arcAngle(f, g), x = g.cx - rr*Math.cos(a); return [S.rtl ? g.w - x : x, g.cy - rr*Math.sin(a)]; };
function dayProgress(ph, ns){ const a = ph.t.fajr*60, b = ph.t.isha*60, p = (ns - a)/(b - a); return {p:Math.min(1, Math.max(0, p)), active:p > 0 && p < 1}; }
function arcLabelPos(p, f, x, y, r, g){
  if (p === 'fajr' || p === 'isha') return [x, y + r + g.below];
  const a = arcAngle(f, g), nx = -Math.cos(a)*(S.rtl ? -1 : 1), ny = -Math.sin(a);
  const d = r + g.gap + Math.abs(nx)*g.lw/2 + Math.abs(ny)*g.lh/2;
  return [Math.min(g.w - g.lw/2, Math.max(g.lw/2, x + nx*d)), y + ny*d];
}
const arcPath = (f0, f1, g, rr = g.r) => { const [x0, y0] = arcPoint(f0, g, rr), [x1, y1] = arcPoint(f1, g, rr);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${rr} ${rr} 0 0 ${S.rtl ? 0 : 1} ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
function arcHTML(ph, gk = 'home'){
  const g = ARCS[gk], dp = dayProgress(ph, nowSec()), span = ph.t.isha - ph.t.fajr, [kx, ky] = arcPoint(dp.p, g), d = arcPath(0, 1, g);
  const fOf = m => Math.min(1, Math.max(0, (m - ph.t.fajr)/span)), kNow = activeKerahat(ph);
  /* Kerahat: thin, muted segments just inside the track – visible next to the markers, never on top of them */
  const kers = S.kerahat ? kerahatWins(ph.t).map(w => { const f0 = fOf(w.a), f1 = fOf(w.b); return f1 - f0 < .001 ? ''
      : `<path class="arc-k ${kNow && kNow.id === w.id ? 'is-now' : ''}" d="${arcPath(f0, f1, g, g.r - g.k)}"/>`; }).join('') : '';
  let marks = '', labels = '', prev = null;
  FIVE.forEach(p => {
    const f = (ph.t[p] - ph.t.fajr)/span, [x, y] = arcPoint(f, g);
    const cur = !!(ph.current && ph.current.d === 0 && ph.current.p === p), r = cur ? g.mc : g.m, is = cur ? g.isc : g.is;
    const tight = prev && Math.hypot(x - prev[0], y - prev[1]) < r + prev[2] + (prev[3] ? 14 : 6); prev = [x, y, r, cur];
    marks += `<g class="pm ${cur ? 'is-current' : ph.passed[p] ? 'is-passed' : ''} ${tight ? 'is-tight' : ''}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">`
      + (cur ? `<circle class="pm-glow" r="${g.glow}"/>` : '') + `<circle class="pm-c" r="${r}"/>`
      + `<svg x="${-is/2}" y="${-is/2}" width="${is}" height="${is}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${g.sw}" stroke-linecap="round" stroke-linejoin="round">${P[PICON[p]]}</svg></g>`;
    const [lx, ly] = arcLabelPos(p, f, x, y, r, g);
    labels += `<text class="arc-t ${cur ? 'is-cur' : ''}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${fmt(ph.t[p])}</text>`;
  });
  return `<svg class="arc arc-${gk}" width="${g.w}" height="${g.h}" viewBox="0 0 ${g.w} ${g.h}" role="img" aria-label="${esc(t('arcPrayers',{n:FIVE.filter(p => ph.passed[p]).length}))}">
      <path class="arc-track" d="${d}"/>
      <path class="arc-done" d="${d}" pathLength="1" stroke-dasharray="${dp.p.toFixed(4)} 2" stroke-opacity="${dp.p > 0 ? 1 : 0}" data-tick="arc-done"/>
      ${kers}
      <g class="arc-now" data-tick="arc-now" data-g="${gk}" transform="translate(${kx.toFixed(1)} ${ky.toFixed(1)})" style="opacity:${dp.active ? 1 : 0}"><circle r="${g.knob}"/></g>
      ${marks}${labels}
    </svg>`;
}
function kerahatSub(p, ph){
  const w = S.kerahat && kerahatWins(ph.t).find(x => x.row === p); if (!w) return '';
  const now = activeKerahat(ph) === null ? false : activeKerahat(ph).id === w.id;
  return `<span class="prow-sub ${now ? 'is-now' : ''}"><i class="k-dot" aria-hidden="true"></i><span>${now ? t('kerahatNow',{b:`<span class="nw">${fmt(w.b)}</span>`}) : t('kerahatRow',{r:`<span class="nw">${fmt(w.a)}–${fmt(w.b)}</span>`})}</span></span>`;
}
function prayerRow(p, ph){
  const cur = !!(ph.current && ph.current.d === 0 && ph.current.p === p);
  const passed = ph.passed[p] && !cur, st = S.notif[p], name = t('p_' + p);
  const hl = S.highLat && (p === 'fajr' || p === 'isha');
  return `<li class="prow ${cur ? 'is-current' : ''} ${passed ? 'is-passed' : ''}" ${cur ? 'aria-current="time"' : ''}>
    <span class="prow-ic">${ic(PICON[p],22)}</span>
    <span class="prow-name">${name}${hl ? `<span class="hl-mark" title="${esc(t('highLatTitle'))}">${ic('info',15)}</span>` : ''}${cur ? `<span class="now-chip">${t('now')}</span>` : ''}${kerahatSub(p, ph)}</span>
    <span class="prow-time">${fmt(ph.t[p])}</span>
    <button class="bell" data-act="bell" data-p="${p}" data-state="${st}" data-fkey="bell-${p}"
      aria-label="${esc(t('bellAria',{p:name, s:t(BELL_LABEL[st])}))}">${ic(BELL_ICON[st],20)}</button></li>`;
}
function homePage(ph){

        ${auto ? ic('locFill',17,'loc-ic') : ''}<span>${cityName()}</span>${!auto && !S.locDenied ? `<span class="tag">${t('manual')}</span>` : ''}</button>
      <p class="home-date">${gregDate()}<br>${hijriDate()}</p>

/* --- Qibla --- */
function dialSVG(q){
  let s = '';
  for (let d = 0; d < 360; d += 5){ const major = d % 30 === 0, a = d*Math.PI/180, r1 = major ? 127 : 134, r2 = 144;
    s += `<line class="tick${major ? ' major' : ''}" x1="${(r1*Math.sin(a)).toFixed(1)}" y1="${(-r1*Math.cos(a)).toFixed(1)}" x2="${(r2*Math.sin(a)).toFixed(1)}" y2="${(-r2*Math.cos(a)).toFixed(1)}"/>`; }
  const dirs = t('dirs');
  for (let d = 0; d < 360; d += 30){ const a = d*Math.PI/180, card = d % 90 === 0, r = card ? 106 : 109;
    s += `<text class="lbl${card ? ' card' : ''}${d === 0 ? ' north' : ''}" x="${(r*Math.sin(a)).toFixed(1)}" y="${(-r*Math.cos(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${card ? dirs[d/45] : d}</text>`; }
  if (q != null) s += `<g transform="rotate(${q})" style="--q:${q}deg"><line class="q-needle" x1="0" y1="-12" x2="0" y2="-80"/><path class="q-head" d="M0 -95 L-8 -79 L8 -79 Z"/>
      <g transform="translate(0 -163)"><g class="upright"><rect class="kaaba" x="-8" y="-8" width="16" height="16" rx="2"/><line class="kaaba-band" x1="-8" y1="-3" x2="8" y2="-3"/></g></g></g>`;
  return s;
}

    <div class="qibla"><div class="cols"><div class="col-a"><h1 class="eyebrow">${t('qibla')} · ${cityName()}</h1>
      <div class="q-readout" aria-hidden="true"><span class="q-deg" data-q="deg">${Math.round(h)}°</span><span class="q-dir" data-q="dir">${dirName(h)}</span></div>
      <div class="compass" data-q="dial" tabindex="0" role="slider" aria-label="${esc(t('dialAria'))}" aria-valuemin="0" aria-valuemax="359" aria-valuenow="${Math.round(h)}" data-fkey="compass">
        <div class="lubber"></div>
        <svg class="dial" viewBox="-150 -150 300 300" data-q="rot" style="--h:${h}deg;transform:rotate(${-h}deg)" aria-hidden="true">${dialSVG(q)}</svg>
        <div class="c-center"></div>
      </div>
      <p class="q-status" data-q="status"></p><p class="sr-only" data-q="live" aria-live="polite"></p></div>

function sheetHead(title, left = '', right = ''){

const adhanDur = () => S.adhan.fajr ? 30 : 27;                          // iOS: notification sounds ≤ 30 s
function adhanSheet(){
  const a = S.adhan, dur = adhanDur(), v = VOICES[a.voice - 1], N = 44, played = Math.floor(a.pos/dur*N);
  let bars = '';
  for (let i = 0; i < N; i++){
    const env = Math.pow(Math.sin(Math.PI*(i + .5)/N), .6);
    const h = .18 + .82*env*(.45 + .55*Math.abs(Math.sin(i*1.93)*Math.cos(i*.71)));
    bars += `<i style="--h:${h.toFixed(2)};--dl:${(-(i*97 % 1100)/1000).toFixed(2)}s" class="${i < played ? 'on' : ''}"></i>`;
  }
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    ${sheetHead(t('adhan'), '', `<button class="icon-btn" data-act="close-sheet" aria-label="${esc(t('close'))}" data-fkey="sheet-close">${ic('xmark',15)}</button>`)}
    <div class="sheet-scroll">
      <div class="player">
        <div class="player-title">${t('voiceN',{n:v.n})} · ${v.place}</div>
        <div class="player-sub">${t('shortAdhan')}${a.fajr ? ' · ' + t('fajrVariant') : ''}</div>
        <div class="wave ${a.playing ? 'playing' : ''}" aria-hidden="true">${bars}</div>
        <input class="scrub" type="range" min="0" max="${dur}" step="0.1" value="${a.pos.toFixed(1)}" style="--pct:${(a.pos/dur*100).toFixed(1)}%"
          aria-label="${esc(t('progress'))}" aria-valuetext="${fmtDur(a.pos)} / ${fmtDur(dur)}" data-fkey="scrub">
        <div class="times"><span data-ad="el">${fmtDur(a.pos)}</span><span data-ad="rem">−${fmtDur(dur - a.pos)}</span></div>
        <button class="play-btn" data-act="adhan-toggle" aria-label="${esc(a.playing ? t('pause') : t('play'))}" data-fkey="play">${ic(a.playing ? 'pause' : 'play',30)}</button>
      </div>
      ${group(VOICES.map(x => rowCheck({label:t('voiceN',{n:x.n}), subText:x.place, checked:a.voice === x.n, k:'voice', v:x.n})).join(''),
              {header:t('voice'), footer:t('voiceFooter'), role:'radiogroup'})}
      ${group(rowSwitch({id:'sw-fajr', label:t('fajrVariant'), on:a.fajr, act:'toggle-fajr'}), {footer:t('fajrVariantFooter')})}
    </div></div>`;
}

function saveUI(){
  document.querySelectorAll('#stage [data-scroll]').forEach(el => { S.scrollPos[el.dataset.scroll] = el.scrollTop; });
  const a = document.activeElement; S._focus = a && a.dataset ? a.dataset.fkey || null : null;
}
function restoreUI(){
  document.querySelectorAll('#stage [data-scroll]').forEach(el => {
    const v = S.scrollPos[el.dataset.scroll]; if (v) el.scrollTop = v;
    markScrolled(el);
  });
  ['method','city'].forEach(applyFilter);
  const key = S.focusNext || S._focus; S.focusNext = null;

}
/* Nav-bar / top-bar edge effect: only the visible page of the pager decides */
function markScrolled(el){
  const pane = el.closest('.pane'); if (pane && pane.dataset.pane !== S.tab) return;
  const pg = el.closest('.page'); if (pg) pg.classList.toggle('scrolled', el.scrollTop > (pg.classList.contains('root-page') ? 4 : 36));
}
function fitTopBar(){
  const bar = document.querySelector('.app-screen .topbar'); if (!bar) return;

        + frame('Dynamic Island · expanded (long press)', homeScreenHTML(diExpanded))
    : frame('Notifications', lockScreenHTML(true));

const render = renderAll;
function runAnims(){
  const list = S.anim; S.anim = []; const scr = appScreen(); if (!scr) return;
  for (const a of list){
    if (a.type === 'push'){
      const pages = scr.querySelectorAll('.main > .page'), top = pages[pages.length - 1], prev = pages[pages.length - 2];
      if (!top || !prev) continue;
      top.classList.add('enter'); prev.classList.remove('under'); void top.offsetWidth; top.classList.remove('enter'); prev.classList.add('under');
    } else if (a.type === 'sheet-in'){ scr.classList.add('opening'); void scr.offsetWidth; scr.classList.remove('opening'); }

      tr.style.transition = 'none'; tr.style.transform = obX(a.from); void tr.offsetWidth; tr.style.transition = ''; tr.style.transform = obX(S.obStep); }

function layout(){

  const stacked = window.innerWidth <= 860;
