/* Live tick: countdown, clocks, sun arc – full re-render only when the phase changes */
function updateTicks(ph){
  const ns = nowSec(), dp = dayProgress(ph, ns);
  document.querySelectorAll('[data-tick]').forEach(el => {
    switch (el.dataset.tick){
      case 'clock': el.textContent = fmtClock(ns); break;
      case 'countdown': el.textContent = S.cdStyle === 'text' ? cdText(ph.remaining) : cdDigital(ph.remaining);
        el.classList.toggle('wide', S.cdStyle !== 'text' && ph.remaining >= 36000); break;
      case 'wcount': el.textContent = t('wIn',{t:cdDigital(ph.remaining)}); break;
      case 'cd': el.textContent = cdDigital(ph.remaining); break;
      case 'la-bar': el.style.width = (100*Math.min(1, Math.max(0, 1 - ph.remaining/ph.span))).toFixed(2) + '%'; break;
      case 'arc-done': el.setAttribute('stroke-dasharray', `${dp.p.toFixed(4)} 2`); el.setAttribute('stroke-opacity', dp.p > 0 ? 1 : 0); break;
      case 'arc-now': { const [x, y] = arcPoint(dp.p, ARCS[el.dataset.g || 'home']); el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`); el.style.opacity = dp.active ? 1 : 0; break; }
      case 'ring': el.setAttribute('stroke-dashoffset', (RING_C*(ph.remaining/ph.span)).toFixed(1)); break;
      case 'pn-range': if (document.activeElement !== el) el.value = Math.floor(ns/60); break;

        const cur = ph.current ? `${T.en['p_' + ph.current.p]} active${ph.current.d < 0 ? ' (since yesterday)' : ''}` : 'no prayer active';
        el.textContent = `${fmt(Math.floor(ns/60))}:${pad(Math.floor(ns % 60))} · ${cur} · next ${T.en['p_' + ph.next.p]} in ${cdDigital(ph.remaining)}`; break; }
    }

}
function tick(){
  const ph = phase(nowSec()), k = phaseKey(ph) + S.view;
  if (k !== lastKey) renderStage(); else updateTicks(ph);

/* Qibla compass: simulated heading with slight sensor jitter; drag or arrow keys to turn */
let qRunning = false; const qLast = {h:null, s:null, ok:false};
const qiblaVisible = () => S.view === 'app' && S.onboarded && S.section === 'prayers' && S.tab === 'qibla' && !S.stack.settings.length;
function startQibla(){ if (!qRunning && qiblaVisible()){ qRunning = true; qLast.h = qLast.s = null; requestAnimationFrame(qLoop); } }
function qLoop(ts){
  if (!qiblaVisible()){ qRunning = false; return; }
  const h = (((S.qibla.heading + (S.qibla.drag ? 0 : .9*Math.sin(ts/850))) % 360) + 360) % 360;
  updateQibla(h); requestAnimationFrame(qLoop);
}
function updateQibla(h){
  const scr = appScreen(); if (!scr) return;
  const rot = scr.querySelector('[data-q="rot"]'); if (!rot) return;
  rot.style.transform = `rotate(${-h}deg)`; rot.style.setProperty('--h', h + 'deg');
  const dial = scr.querySelector('[data-q="dial"]'), hr = Math.round(h) % 360;
  if (hr !== qLast.h){ qLast.h = hr; scr.querySelector('[data-q="deg"]').textContent = hr + '°'; scr.querySelector('[data-q="dir"]').textContent = dirName(hr);
    dial.setAttribute('aria-valuenow', hr); dial.setAttribute('aria-valuetext', `${hr}° ${dirName(hr)}`); }
  const q = CITIES[cityId()].qibla; if (q == null) return;
  const diff = ((q - h + 540) % 360) - 180, ok = Math.abs(diff) <= 3, key = ok ? 'ok' : (diff > 0 ? 'R' : 'L') + Math.round(Math.abs(diff));
  if (key === qLast.s) return; qLast.s = key;
  const st = scr.querySelector('[data-q="status"]');
  st.className = 'q-status' + (ok ? ' ok' : '');
  st.innerHTML = ok ? ic('check',18) + `<span>${t('facing')}</span>` : `<span>${t(diff > 0 ? 'turnRight' : 'turnLeft')} ${Math.round(Math.abs(diff))}°</span>`;
  dial.classList.toggle('aligned', ok);
  if (ok !== qLast.ok){ scr.querySelector('[data-q="live"]').textContent = ok ? t('facing') : '';
    if (ok){ dial.classList.remove('pulse'); void dial.offsetWidth; dial.classList.add('pulse'); } }
  qLast.ok = ok;
}

function push(id){ if (S.busy) return; S.stack.settings.push(id); delete S.scrollPos['pg-' + id]; S.search.method = ''; S.anim.push({type:'push'}); S.focusNext = 'back-' + id; render(); }

  if (S.busy) return; const scr = appScreen(), pages = scr.querySelectorAll('.main > .page');
  const top = pages[pages.length - 1], prev = pages[pages.length - 2]; if (!top || !prev) return;
  S.busy = true; prev.removeAttribute('inert'); top.classList.add('enter'); prev.classList.remove('under');
  const popped = S.stack.settings[S.stack.settings.length - 1];

function stopAdhan(){ S.adhan.playing = false; clearInterval(adhanTimer); adhanTimer = null; }
function adhanUI(){
  const scr = appScreen(); if (!scr) return; const a = S.adhan, dur = adhanDur();

function adhanStep(){
  const n = performance.now(); S.adhan.pos += (n - adhanLast)/1000; adhanLast = n;

}
const ACT = {
  'pn-set'(el){ const k = el.dataset.k; let v = el.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false;
    S[k] = v; if (k === 'view' && v !== 'app') stopAdhan(); render(); },
  jump(el){

    if (v === 'home') S.tab = 'today';

  alert(el){ const v = el.dataset.v, kind = S.alert;

                           else { S.locDenied = false; S.autoLocation = true; S.city = S.deviceCity; obGo(2); } }
      else { S.notifAllowed = v === 'allow'; finishOnboarding(); } }); },
  tab(el){ const v = el.dataset.v; if (S.tab === v) return; goPane(v, paneX(PANES.indexOf(S.tab))); },
  'guide-pick'(el){ const v = el.dataset.v; S.guidePick = v === guideState(phase(nowSec())).auto ? null : v; render(); },
  'guide-now'(){ S.guidePick = null; S.focusNext = 'gp-' + guideState(phase(nowSec())).auto; render(); },
  'open-settings'(){ push('settings'); },
  section(el){ const v = el.dataset.v; if (S.section === v && !S.stack.settings.length) return; S.section = v; S.stack.settings = []; render(); },
  'verse-pick'(el){ S.verseIdx = Number(el.dataset.v); S.scrollPos.verses = 0; render(); },
  'verse-share'(){ toast(t('shareToast'), 'share'); },
  'verse-copy'(){ toast(t('copied'), 'copy'); },
  qstep(el){ const k = el.dataset.k, d = Number(el.dataset.d), q = S.qada;
    if (k.startsWith('open-')){ const p = k.slice(5); if (d < 0){ if (q.open[p] > 0) q.open[p]--; } else { q.open[p]++; q.tot[p]++; } }
    else { const [lo, hi] = {years:[0,60], months:[0,11], days:[0,30], perDay:[1,20]}[k]; q[k] = Math.max(lo, Math.min(hi, q[k] + d)); }

  qwitr(){ S.qada.witr = !S.qada.witr; render(); },

  'toggle-loc'(){ if (S.locDenied) return; S.autoLocation = !S.autoLocation; if (S.autoLocation) S.city = S.deviceCity; render(); },

  step(el){ const p = el.dataset.p; S.adj[p] = Math.max(-30, Math.min(30, S.adj[p] + Number(el.dataset.d))); render(); },
  'adj-reset'(){ PRAYERS.forEach(p => S.adj[p] = 0); S.focusNext = 'st-fajr-p'; render(); },
  'seg-notif'(el){ S.notif[el.dataset.p] = el.dataset.v; render(); },

  'close-sheet'(){ closeSheet(); },
  'select-city'(el){ S.city = el.dataset.v; S.autoLocation = false; if (S.highLat && S.city !== 'berlin') S.highLat = false; reapplyPreset();
    closeSheet(() => { if (!S.onboarded) obGo(2); else render(); }); },
  'use-current'(){ if (S.locDenied) return; S.autoLocation = true; S.city = S.deviceCity; reapplyPreset(); closeSheet(() => { if (!S.onboarded) obGo(2); else render(); }); },

function applyFilter(key){

  const nr = scr.querySelector(`[data-noresults="${key}"]`); if (nr) nr.hidden = n > 0 || !scr.querySelector(`[data-filter="${key}"]`);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;

});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.search){ S.search[el.dataset.search] = el.value; applyFilter(el.dataset.search); }

    const sel = document.querySelector('[data-pn="preset"]'); if (sel) sel.value = 'custom'; tick(); }
  else if (el.classList.contains('scrub')){ S.adhan.pos = Number(el.value); adhanUI(); }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.pn; if (!k || k === 'time') return;
  if (k === 'city'){ S.city = el.value; S.deviceCity = el.value; if (S.highLat && el.value !== 'berlin') S.highLat = false; reapplyPreset(); }
  else if (k === 'preset') applyPreset(el.value);

document.addEventListener('scroll', e => {

}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S.alert) return; if (S.sheet){ e.preventDefault(); closeSheet(); } return; }
  const c = e.target.closest && e.target.closest('.compass');
  if (c && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault(); const d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 5 : -5;
    S.qibla.heading = (((S.qibla.heading + d) % 360) + 360) % 360;
  }
});
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.compass'); if (!c) return;
  const r = c.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  const ang = ev => Math.atan2(ev.clientX - cx, -(ev.clientY - cy))*180/Math.PI;
  const a0 = ang(e), h0 = S.qibla.heading; S.qibla.drag = true; c.setPointerCapture(e.pointerId);

  const up = () => { S.qibla.drag = false; c.removeEventListener('pointermove', move); c.removeEventListener('pointerup', up); c.removeEventListener('pointercancel', up); };
  c.addEventListener('pointermove', move); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
});
/* Swipe between "Zeiten" and "Qibla" (as the pages of Projekt-Health "Heute"); rubber band at the ends */
let swallowClick = false;
document.addEventListener('click', e => { if (swallowClick){ e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);
document.addEventListener('pointerdown', e => {
  const pager = e.target.closest('.pager');
  if (!pager || e.button > 0 || S.busy || e.target.closest('.compass, input')) return;
  const x0 = e.clientX, y0 = e.clientY, idx = PANES.indexOf(S.tab);
  const scale = pager.getBoundingClientRect().width / pager.offsetWidth;          // device frame is CSS-scaled

    const mx = ev.clientX - x0, my = ev.clientY - y0;
